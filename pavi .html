<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Test</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5fbff;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #ffffff,
                #e8f7ff
            );
        }

        .container {
            width: 90%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 50px;
        }

        h1 {
            font-size: 55px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        h1 span {
            color: #159ed5;
        }

        p {
            color: #666;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            background: #159ed5;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        /* =========================
           ANIMATED ELECTRICIAN
        ========================= */

        .image-box {
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .circle {
            width: 330px;
            height: 330px;
            background: #dff5ff;
            border-radius: 50%;

            animation: circleMove 3s ease-in-out infinite;
        }

        .person {
            position: absolute;
            font-size: 170px;

            animation: personMove 2.5s ease-in-out infinite;
        }

        /* Lightning */

        .lightning {
            position: absolute;
            top: 40px;
            right: 50px;

            font-size: 65px;
            color: #ffd000;

            filter: drop-shadow(
                0 0 15px #ffd000
            );

            animation: lightning 0.8s ease-in-out infinite;
        }

        /* Small spark */

        .spark {
            position: absolute;
            font-size: 35px;
            color: #ffc400;

            animation: spark 1.5s ease-in-out infinite;
        }

        .spark1 {
            left: 50px;
            top: 100px;
        }

        .spark2 {
            right: 30px;
            bottom: 100px;

            animation-delay: .5s;
        }

        /* =========================
           KEYFRAMES
        ========================= */

        @keyframes personMove {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes circleMove {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes lightning {

            0% {
                transform: scale(1) rotate(0);
                opacity: .4;
            }

            50% {
                transform: scale(1.35) rotate(10deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: .4;
            }
        }

        @keyframes spark {

            0% {
                transform: translateY(0) scale(1);
                opacity: .3;
            }

            50% {
                transform: translateY(-20px) scale(1.4);
                opacity: 1;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: .3;
            }
        }

        /* MOBILE */

        @media(max-width:700px) {

            .container {
                grid-template-columns: 1fr;
                text-align: center;
            }

            h1 {
                font-size: 40px;
            }

            .image-box {
                order: -1;
                height: 350px;
            }

            .circle {
                width: 260px;
                height: 260px;
            }

            .person {
                font-size: 120px;
            }

            .lightning {
                right: 20px;
            }
        }

    </style>
</head>

<body>

    <section class="hero">

        <div class="container">

            <div>
                <h1>
                    Reliable Electrical
                    <span>Help</span> in Chennai
                </h1>

                <p>
                    Fast, safe and professional electrical
                    services for homes and businesses.
                </p>

                <a href="#" class="btn">
                    Our Services
                </a>
            </div>


            <div class="image-box">

                <div class="circle"></div>

                <div class="person">
                    👨‍🔧
                </div>

                <div class="lightning">
                    ⚡
                </div>

                <div class="spark spark1">
                    ✦
                </div>

                <div class="spark spark2">
                    ✧
                </div>

            </div>

        </div>

    </section>

</body>
</html>
